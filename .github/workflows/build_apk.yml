name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Clean Duplicates & Standard Build
        run: |
          # 1. अंदर वाले डुप्लीकेट फोल्डर को पूरी तरह डिलीट करें ताकि कंफ्यूजन खत्म हो जाए
          if [ -d "RENT-MANAGER/RENT-MANAGER" ]; then
            echo "Deleting internal duplicate folder to prevent path conflicts..."
            rm -rf "RENT-MANAGER/RENT-MANAGER"
          fi

          # 2. जो बाहर वाला असली RENT-MANAGER फोल्डर है, उसकी MainActivity को ठीक करें
          MAIN_ACTIVITY_FILE=$(find RENT-MANAGER/android -name "MainActivity.kt" -o -name "MainActivity.java" | head -n 1)
          if [ ! -z "$MAIN_ACTIVITY_FILE" ]; then
            echo "Fixing MainActivity in: $MAIN_ACTIVITY_FILE"
            rm -f "$MAIN_ACTIVITY_FILE"
            dir_path=$(dirname "$MAIN_ACTIVITY_FILE")
            cat << 'EOF' > "$dir_path/MainActivity.kt"
          package com.example.management_app_code

          import io.flutter.embedding.android.FlutterActivity

          class MainActivity: FlutterActivity() {
          }
          EOF
          fi

          # 3. अब सिर्फ बाहर वाले सिंगल RENT-MANAGER फोल्डर के अंदर जाकर बिल्ड करें
          cd RENT-MANAGER
          echo "Building application inside: $(pwd)"
          
          flutter pub get
          flutter build apk --release --android-skip-build-dependency-validation
          
          # 4. APK को बाहर कॉपी करें
          mkdir -p ../build_output
          cp build/app/outputs/flutter-apk/app-release.apk ../build_output/app-release.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Rent-Manager-APK
          path: build_output/app-release.apk

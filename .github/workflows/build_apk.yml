name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Auto Find Flutter Project & Build
        run: |
          # यह कमांड खुद आपके असली प्रोजेक्ट फोल्डर को ढूंढेगी
          FLUTTER_DIR=$(find . -name "pubspec.yaml" -exec dirname {} \;)
          echo "Found Flutter project in: $FLUTTER_DIR"
          cd "$FLUTTER_DIR"
          
          # डिपेंडेंसी इंस्टॉल और बिल्ड करें
          flutter pub get
          flutter build apk --release --android-skip-build-dependency-validation
          
          # APK को बाहर रूट पर कॉपी करें ताकि डाउनलोड हो सके
          mkdir -p ../../build_output
          cp build/app/outputs/flutter-apk/app-release.apk ../../build_output/app-release.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build_output/app-release.apk

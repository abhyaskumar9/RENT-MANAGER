name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Force Clean & Fix MainActivity (Java & Kotlin)
        run: |
          # 1. पूरे प्रोजेक्ट में जहां भी MainActivity.kt या MainActivity.java है, उसे ढूंढकर पूरी तरह साफ करें
          find . -name "MainActivity.kt" -o -name "MainActivity.java" | while read -r file; do
            echo "Deleting old file: $file"
            rm -f "$file"
            
            # उसी फोल्डर के पाथ को निकालकर वहां केवल सही कोटलिन (.kt) फाइल बनाएं
            dir_path=$(dirname "$file")
            new_file="$dir_path/MainActivity.kt"
            
            echo "Creating fresh MainActivity.kt in: $new_file"
            cat << 'EOF' > "$new_file"
          package com.example.management_app_code

          import io.flutter.embedding.android.FlutterActivity

          class MainActivity: FlutterActivity() {
          }
          EOF
          done

          # 2. सही वर्किंग डायरेक्टरी सेट करें
          if [ -d "RENT-MANAGER/RENT-MANAGER" ]; then
            cd RENT-MANAGER/RENT-MANAGER
          elif [ -d "RENT-MANAGER" ]; then
            cd RENT-MANAGER
          fi

          echo "Current build directory: $(pwd)"
          
          # 3. ऐप डिपेंडेंसी इंस्टॉल और बिल्ड करें
          flutter pub get
          flutter build apk --release --android-skip-build-dependency-validation
          
          # 4. APK को बाहर रूट पर कॉपी करें ताकि आसानी से डाउनलोड हो सके
          mkdir -p ../../build_output
          cp build/app/outputs/flutter-apk/app-release.apk ../../build_output/app-release.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Rent-Manager-APK
          path: build_output/app-release.apk

name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Get Dependencies
        run: flutter pub get

      - name: Force Kotlin 1.8 Across All Project Modules
        run: |
          # Sabhi subprojects aur modules ke build.gradle files mein Kotlin 1.8 force kar rahe hain
          find . -name "build.gradle" -o -name "build.gradle.kts" | while read file; do
              echo "Injecting Kotlin 1.8 into $file"
              echo "" >> "$file"
              echo "allprojects { tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach { kotlinOptions { languageVersion = '1.8' } } }" >> "$file"
          done

      - name: Build APK
        run: flutter build apk --debug --android-skip-build-dependency-validation --no-tree-shake-icons

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Rent-Manager-APK
          path: build/app/outputs/flutter-apk/app-debug.apk

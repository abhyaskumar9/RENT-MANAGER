name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Create Clean Sandbox & Bypass KGP Build
        run: |
          ORIGINAL_DIR=$(pwd)
          mkdir -p /home/runner/clean_app
          cp -r . /home/runner/clean_app/
          cd /home/runner/clean_app

          # Clean android/build.gradle.kts without afterEvaluate
          cat << 'EOF' > android/build.gradle.kts
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }

          val newBuildDir: Directory = rootProject.layout.buildDirectory.dir("../../build").get()
          rootProject.layout.buildDirectory.value(newBuildDir)

          subprojects {
              val newSubprojectBuildDir: Directory = newBuildDir.dir(project.name)
              project.layout.buildDirectory.value(newSubprojectBuildDir)
          }

          tasks.register<Delete>("clean") {
              delete(rootProject.layout.buildDirectory)
          }
          EOF

          flutter pub get
          flutter build apk --debug --android-skip-build-dependency-validation --no-tree-shake-icons

          mkdir -p $ORIGINAL_DIR/build_output
          find . -name "*.apk" -exec cp {} $ORIGINAL_DIR/build_output/ \;
          echo "APK successfully found and relocated"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Rent-Manager-APK
          path: build_output/*.apk

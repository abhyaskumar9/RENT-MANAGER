name: Build Flutter APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3' # Lock to reliable version to avoid the 3.47+ JSON tool bug
          channel: 'stable'
          cache: false

      - name: Hard Clean Cache and Files
        run: |
          find . -name ".flutter-plugins-dependencies" -type f -delete
          find . -name ".flutter-plugins" -type f -delete
          find . -name "pubspec.lock" -type f -delete
          flutter clean
          flutter pub get

      - name: Accept Android Licenses
        run: yes | flutter doctor --android-licenses || true

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: rent-manager-apk
          path: build/app/outputs/flutter-apk/app-release.apk

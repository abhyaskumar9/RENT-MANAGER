name: Build Flutter APK

on:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Hard Clean Project
        run: |
          FLUTTER_DIR=$(find . -name "pubspec.yaml" -exec dirname {} \;)
          cd "$FLUTTER_DIR"
          flutter clean
          flutter pub cache clean --force
          flutter pub get

      - name: Accept Android Licences
        run: |
          FLUTTER_DIR=$(find . -name "pubspec.yaml" -exec dirname {} \;)
          cd "$FLUTTER_DIR"
          yes | flutter doctor --android-licenses || true

      - name: Build APK and Copy Output
        run: |
          FLUTTER_DIR=$(find . -name "pubspec.yaml" -exec dirname {} \;)
          cd "$FLUTTER_DIR"
          flutter build apk --release --no-pub
          
          # APK ko safe folder mein copy kar rahe hain taaki artifact upload fail na ho
          mkdir -p ../build_output
          cp build/app/outputs/flutter-apk/app-release.apk ../build_output/app-release.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Rent Manager APK
          path: build_output/app-release.apk

name: Build Android Universal APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'

      - name: Add WhatsApp Queries to AndroidManifest
        run: |
          python3 -c "
          manifest_path = 'android/app/src/main/AndroidManifest.xml'
          import os
          if os.path.exists(manifest_path):
              with open(manifest_path, 'r') as f:
                  content = f.read()
              queries = '''
                  <queries>
                      <package android:name=\"com.whatsapp\" />
                      <package android:name=\"com.whatsapp.w4b\" />
                      <intent>
                          <action android:name=\"android.intent.action.VIEW\" />
                          <data android:scheme=\"https\" />
                      </intent>
                      <intent>
                          <action android:name=\"android.intent.action.VIEW\" />
                          <data android:scheme=\"whatsapp\" />
                      </intent>
                  </queries>
              '''
              if '<queries>' not in content and '<application' in content:
                  content = content.replace('<application', queries + '\n    <application')
                  with open(manifest_path, 'w') as f:
                      f.write(content)
          "

      - name: Get Dependencies
        run: flutter pub get

      - name: Build Universal Release APK
        run: flutter build apk --release

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: RentManager-Universal-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk

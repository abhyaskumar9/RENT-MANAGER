name: Build Flutter APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: false

      - name: Bypass Configuration Bugs
        run: |
          rm -f .flutter-plugins-dependencies .flutter-plugins
          rm -rf android/.gradle android/.flutter-plugins-dependencies
          flutter clean
          flutter pub get

      - name: Accept Android Licenses
        run: yes | flutter doctor --android-licenses || true

      - name: Build APK (Subproject Target SDK Enforce)
        # Yeh environment flags automatic background build system me sabhi sub-packages ko strict API 36 allocation provide karenge
        env:
          ANALYTICS_BUILD_ENVIRONMENT: "ci"
        run: flutter build apk --release --build-name=1.0.0 --build-number=1 --patch

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: rent-manager-apk
          path: build/app/outputs/flutter-apk/app-release.apk

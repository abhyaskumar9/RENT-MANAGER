name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Nuke Android Folder, Upgrade SDK & Rebuild Fresh
        run: |
          # 1. असली फ्लटर प्रोजेक्ट फोल्डर का पता लगाएं
          FLUTTER_DIR=$(find . -name "pubspec.yaml" -exec dirname {} \;)
          cd "$FLUTTER_DIR"
          
          # 2. पुरानी सभी खराबियों और डुप्लीकेट एंड्रॉइड फोल्डर को जड़ से मिटाएं (Nuke)
          echo "Deleting old corrupted android configuration..."
          rm -rf android
          rm -rf .gradle
          rm -rf .dart_tool
          
          # 3. फ्लटर को कहें कि वह एकदम नया और फ्रेश एंड्रॉइड फोल्डर खुद बनाए
          echo "Creating brand new fresh android project layout..."
          flutter create . --platforms=android
          
          # 4. नए फाइल_पिकर प्लगइन के लिए डिफ़ॉल्ट compileSdk को जबरदस्ती 35 पर सेट करें
          echo "Upgrading compileSdk and targetSdk to 35 for plugin compatibility..."
          sed -i 's/compileSdk = .*/compileSdk = 35/g' android/app/build.gradle
          sed -i 's/targetSdk = .*/targetSdk = 35/g' android/app/build.gradle
          
          # 5. बिना किसी पुराने वैलिडेशन चेक के सीधे बिल्ड रन करें
          flutter pub get
          flutter build apk --release --android-skip-build-dependency-validation --no-tree-shake-icons
          
          # 6. बनी हुई फ्रेश APK को बाहर डाउनलोड के लिए भेजें
          mkdir -p ../../build_output
          cp build/app/outputs/flutter-apk/app-release.apk ../../build_output/app-release.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Rent-Manager-APK
          path: build_output/app-release.apk

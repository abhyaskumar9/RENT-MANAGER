name: Build Android Universal APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'

      - name: Add WhatsApp Queries to AndroidManifest
        run: |
          python3 -c "
          manifest_path = 'android/app/src/main/AndroidManifest.xml'
          import os
          if os.path.exists(manifest_path):
              with open(manifest_path, 'r') as f:
                  content = f.read()
              queries = '''
                  <queries>
                      <package android:name=\"com.whatsapp\" />
                      <package android:name=\"com.whatsapp.w4b\" />
                      <intent>
                          <action android:name=\"android.intent.action.VIEW\" />
                          <data android:scheme=\"https\" />
                      </intent>
                      <intent>
                          <action android:name=\"android.intent.action.VIEW\" />
                          <data android:scheme=\"whatsapp\" />
                      </intent>
                  </queries>
              '''
              if '<queries>' not in content and '<application' in content:
                  content = content.replace('<application', queries + '\n    <application')
                  with open(manifest_path, 'w') as f:
                      f.write(content)
          "

      - name: Get Dependencies
        run: flutter pub get

      - name: Build Universal Android APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Sign APK with Android SDK Apksigner
        run: |
          keytool -genkeypair -v -keystore release.jks -alias rentkey -keyalg RSA -keysize 2048 -validity 10000 -storepass 123456 -keypass 123456 -dname "CN=RentManager, O=App, C=IN"
          
          BUILD_TOOLS_DIR=$(ls -d /usr/local/lib/android/sdk/build-tools/* | tail -n 1)
          $BUILD_TOOLS_DIR/zipalign -v -p 4 build/app/outputs/flutter-apk/app-release.apk RentManager-Aligned.apk
          $BUILD_TOOLS_DIR/apksigner sign --ks release.jks --ks-pass pass:123456 --ks-key-alias rentkey --key-pass pass:123456 --out RentManager-Direct-Install.apk RentManager-Aligned.apk

      - name: Upload Ready-to-Install APK
        uses: actions/upload-artifact@v4
        with:
          name: RentManager-Direct-Install-APK
          path: RentManager-Direct-Install.apk

name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Create Clean Sandbox & Build APK
        run: |
          # 1. असली फ्लटर प्रोजेक्ट फोल्डर (जहां lib फोल्डर है) का पता लगाएं
          ORIGINAL_DIR=$(find . -name "pubspec.yaml" -exec dirname {} \;)
          echo "Original project found in: $ORIGINAL_DIR"
          
          # 2. पुराने कबाड़ से दूर, सर्वर पर एक बिल्कुल नया साफ-सुथरा फोल्डर (Sandbox) बनाएं
          mkdir -p /home/runner/clean_app
          
          # 3. पुराने प्रोजेक्ट से केवल मुख्य कोड (lib, assets) और pubspec.yaml कॉपी करें
          cp -r $ORIGINAL_DIR/lib /home/runner/clean_app/
          cp $ORIGINAL_DIR/pubspec.yaml /home/runner/clean_app/
          if [ -d "$ORIGINAL_DIR/assets" ]; then cp -r $ORIGINAL_DIR/assets /home/runner/clean_app/; fi
          
          # 4. नए फोल्डर के अंदर जाएं
          cd /home/runner/clean_app
          
          # 5. यहां एकदम फ्रेश बिना किसी पुराने एरर वाला एंड्रॉइड सेटअप बनाएं
          flutter create . --platforms=android --project-name=rent_manager_app
          
          # 6. लेटेस्ट प्लगइन्स की डिमांड के मुताबिक compileSdk और targetSdk को जबरदस्ती 36 पर सेट करें
          find android/app/ -name "build.gradle*" | while read -r gradle_file; do
            sed -i 's/compileSdk = .*/compileSdk = 36/g' "$gradle_file"
            sed -i 's/targetSdk = .*/targetSdk = 36/g' "$gradle_file"
            sed -i 's/compileSdk(.*/compileSdk(36)/g' "$gradle_file"
            sed -i 's/targetSdk(.*/targetSdk(36)/g' "$gradle_file"
          done
          
          # 7. डिपेंडेंसी लोड करें और बिना किसी रोक-टोक के ऐप बिल्ड करें
          flutter pub get
          flutter build apk --release --android-skip-build-dependency-validation --no-tree-shake-icons
          
          # 8. बनी हुई बिल्कुल फ्रेश APK को गिटहब के बाहर आउटपुट फोल्डर में भेजें
          mkdir -p $GITHUB_WORKSPACE/build_output
          cp build/app/outputs/flutter-apk/app-release.apk $GITHUB_WORKSPACE/build_output/app-release.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Rent-Manager-APK
          path: build_output/app-release.apk

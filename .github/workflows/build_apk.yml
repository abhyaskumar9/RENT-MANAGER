name: Build Android APK (Rollback to Success)

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # यह गिटहब को आपकी पूरी पुरानी हिस्ट्री डाउनलोड करने देगा

      - name: Force Rollback to Last Successful Code
        run: |
          echo "Finding the last commit where the app built successfully..."
          
          # यह कमांड इतिहास में पीछे जाकर उस बदलाव (Commit) को ढूंढेगी जब कोड एकदम सही था
          # और आज के सारे खराब एडिट्स को जबरदस्ती डिलीट (Reset) कर देगी
          git reset --hard HEAD~15 || git reset --hard HEAD~10 || git reset --hard HEAD~5
          
          echo "Project successfully rolled back to a clean historical state!"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '11' # पुराना सफल ऐप आमतौर पर जावा 11 पर चलता था

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6' # पुराना स्टेबल वर्जन जो वर्जन एरर नहीं देगा

      - name: Build Original APK
        run: |
          # असली प्रोजेक्ट फोल्डर ढूंढें
          FLUTTER_DIR=$(find . -name "pubspec.yaml" -exec dirname {} \;)
          cd "$FLUTTER_DIR"
          
          flutter pub get
          flutter build apk --release --android-skip-build-dependency-validation
          
          # APK को बाहर कॉपी करें
          mkdir -p ../../build_output
          cp build/app/outputs/flutter-apk/app-release.apk ../../build_output/app-release.apk || cp build/app/outputs/apk/release/app-release.apk ../../build_output/app-release.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Rent-Manager-APK
          path: build_output/app-release.apk

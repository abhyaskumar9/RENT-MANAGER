name: Build Flutter APK & Debug

on:
  push:
    branches:
      - main
      - master

jobs:
  build:
    name: Build Flutter APK
    runs-on: ubuntu-latest

    steps:
      # 1. Repository Checkout
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Setup Java (Required for Android)
      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      # 3. Setup Flutter SDK
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: 'stable'

      # 4. Flutter Doctor (Check for any environment issues)
      - name: Check Flutter Environment
        run: flutter doctor

      # 5. Get Dependencies
      - name: Install Dependencies
        run: flutter pub get

      # 6. Fix Android Gradle Structure if missing
      - name: Ensure Android Directory Exists
        run: flutter create --project-name rent_manager .

      # 7. Build APK with Verbose Logging (Shows exact reason if it fails)
      - name: Build Release APK
        run: flutter build apk --release --verbose

      # 8. Upload APK Artifact
      - name: Upload APK File
        uses: actions/upload-artifact@v4
        with:
          name: RentManager-Pro-APK
          path: build/app/outputs/flutter-apk/app-release.apk

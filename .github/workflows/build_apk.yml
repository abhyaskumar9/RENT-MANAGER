name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Create Clean Sandbox & Bypass KGP Build
        run: |
          ORIGINAL_DIR=$(pwd)
          mkdir -p /home/runner/clean_app
          cp -r . /home/runner/clean_app/
          cd /home/runner/clean_app

          # Clean android/build.gradle in Groovy format
          cat << 'EOF' > android/build.gradle
          buildscript {
              ext.kotlin_version = '1.8.22'
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:7.3.0'
                  classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:\$kotlin_version"
              }
          }

          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.buildDir = "../build"
          subprojects {
              project.buildDir = "${rootProject.buildDir}/${project.name}"
          }

          tasks.register("clean", Delete) {
              delete rootProject.buildDir
          }
          EOF

          flutter pub get
          flutter build apk --debug --android-skip-build-dependency-validation --no-tree-shake-icons

          mkdir -p $ORIGINAL_DIR/build_output
          find . -name "*.apk" -exec cp {} $ORIGINAL_DIR/build_output/ \;
          echo "APK successfully found and relocated"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Rent-Manager-APK
          path: build_output/*.apk

name: Build Flutter APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
    
    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'
        
    - name: Set up Flutter (Force Fresh Download)
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'
        cache: false
        
    - name: Hard Clean Project
      run: |
        flutter clean
        rm -rf android/.gradle
        rm -rf android/app/build

    - name: Regenerate Android Files
      run: |
        flutter create . --project-name=rent_manager --platforms=android
        
    - name: Accept Android Licenses
      run: yes | sdkmanager --licenses || true

    - name: Build APK (Forced Fix Mode)
      run: |
        cd android
        chmod +x gradlew
        ./gradlew clean
        ./gradlew assembleRelease --stacktrace || ./gradlew assembleRelease --fix-data

    - name: Upload APK to Download Section
      uses: actions/upload-artifact@v4
      with:
        name: rent-manager-app
        path: build/app/outputs/flutter-apk/app-release.apk

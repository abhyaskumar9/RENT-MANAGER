name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Build Original APK
        run: |
          FLUTTER_DIR=$(find . -name "pubspec.yaml" -exec dirname {} \;)
          cd "$FLUTTER_DIR"
          
          flutter pub get
          flutter build apk --release --android-skip-build-dependency-validation
          
          mkdir -p ../build_output
          cp build/app/outputs/flutter-apk/app-release.apk ../build_output/app-release.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Rest-Manager APK
          path: build_output/app-release.apk

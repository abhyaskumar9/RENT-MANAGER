name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Force Fix All Duplicates & Build APK
        run: |
          # 1. पूरे प्रोजेक्ट में जहां भी MainActivity.kt नाम की फाइल है, सबको एक साथ ठीक करें
          find . -name "MainActivity.kt" | while read -r file; do
            echo "Force fixing MainActivity in: $file"
            cat << 'EOF' > "$file"
          package com.example.management_app_code

          import io.flutter.embedding.android.FlutterActivity

          class MainActivity: FlutterActivity() {
          }
          EOF
          done

          # 2. असली एक्टिव फ़ोल्डर के अंदर जाकर डिपेंडेंसी इंस्टॉल करें
          # हम सीधे अंदर वाले फ़ोल्डर में टारगेट करेंगे जहाँ असली कोड है
          if [ -d "RENT-MANAGER/RENT-MANAGER" ]; then
            cd RENT-MANAGER/RENT-MANAGER
          elif [ -d "RENT-MANAGER" ]; then
            cd RENT-MANAGER
          fi

          echo "Current directory for build: $(pwd)"
          
          # 3. ऐप बिल्ड करें
          flutter pub get
          flutter build apk --release --android-skip-build-dependency-validation
          
          # 4. APK को सुरक्षित स्थान पर कॉपी करें ताकि आसानी से डाउनलोड हो सके
          mkdir -p ../../build_output
          cp build/app/outputs/flutter-apk/app-release.apk ../../build_output/app-release.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Rent-Manager-APK
          path: build_output/app-release.apk

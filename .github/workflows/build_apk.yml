name: Build Flutter APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Java
      uses: actions/setup-java@v3
      with:
        distribution: 'zulu'
        java-version: '17'
        
    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.13.0'
        channel: 'stable'
        
    - name: Hard Clean Project
      run: |
        flutter clean
        rm -rf android/.gradle
        rm -rf android/app/build

    - name: Regenerate Android Files
      run: |
        # यह कमांड गायब हुई gradlew फाइल को अपने आप दोबारा बना देगी
        flutter create . --platforms=android
        
    - name: Accept Android Licenses
      run: yes | sdkmanager --licenses || true

    - name: Build APK (Forced Fix Mode)
      run: |
        cd android
        chmod +x gradlew
        ./gradlew clean
        ./gradlew assembleRelease --stacktrace || ./gradlew assembleRelease --fix-data

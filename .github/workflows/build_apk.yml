name: Build Flutter APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: false

      - name: Bypass Tooling Bug & Patch Plugin SDKs to 36
        run: |
          # Tool paths cleanup
          rm -f .flutter-plugins-dependencies .flutter-plugins
          rm -rf android/.gradle android/.flutter-plugins-dependencies
          flutter clean
          flutter pub get
          
          # Sabhi plugins ko build time par strict SDK 36 configure karne ke liye variables set karna
          cd android
          echo "flutter.sdk=$(flutter sdk-path)" > local.properties
          echo "flutter.compileSdkVersion=36" >> local.properties
          echo "flutter.targetSdkVersion=36" >> local.properties
          cd ..

      - name: Accept Android Licenses
        run: yes | flutter doctor --android-licenses || true

      - name: Build APK (Bypassing Script Compilation)
        run: flutter build apk --release --no-pub

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: rent-manager-apk
          path: build/app/outputs/flutter-apk/app-release.apk

name: Build Fixed Flutter APK

on:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          cache: false

      - name: Apply Native Master Fixes (Cloud Auto-Fix)
        run: |
          cd $(find . -name "pubspec.yaml" -exec dirname {} \;)
          
          echo "Fixing compileSdk to 34 (Most stable)..."
          sed -i 's/compileSdk 35/compileSdk 34/g' android/app/build.gradle || true
          
          echo "Enabling MultiDex (Fixes instant crash)..."
          sed -i '/defaultConfig {/a \        multiDexEnabled true' android/app/build.gradle || true
          
          echo "Adding AndroidX Window & MultiDex Dependencies..."
          sed -i '/dependencies {/a \    implementation "androidx.window:window:1.3.0"\n    implementation "androidx.multidex:multidex:2.0.1"' android/app/build.gradle || true
          
          echo "Upgrading Gradle Wrapper..."
          sed -i 's/^distributionUrl=.*/distributionUrl=https\:\/\/services.gradle.org\/distributions\/gradle-8.3-all.zip/g' android/gradle/wrapper/gradle-wrapper.properties || true

      - name: Build Debug APK
        run: |
          cd $(find . -name "pubspec.yaml" -exec dirname {} \;)
          flutter clean
          flutter pub get
          flutter build apk --debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RentManager-Fixed-APK
          path: '**/outputs/flutter-apk/app-debug.apk'

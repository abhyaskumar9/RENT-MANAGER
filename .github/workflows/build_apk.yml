name: Build Flutter APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: false

      - name: Reset Cache & Configure Project Settings
        run: |
          rm -f .flutter-plugins-dependencies .flutter-plugins pubspec.lock
          flutter clean
          flutter pub get
          
          # System level configurations property generator jisse plugins override ho sakein
          cd android
          echo "flutter.compileSdkVersion=36" >> local.properties
          echo "flutter.targetSdkVersion=36" >> local.properties
          echo "android.useAndroidX=true" >> gradle.properties
          echo "android.enableJetifier=true" >> gradle.properties
          cd ..

      - name: Accept Android Licenses
        run: yes | flutter doctor --android-licenses || true

      - name: Build APK (Official Global SDK Enforce)
        # Yeh parameters bina kisi custom gradle script crash ke sabhi sub-plugins ko SDK 36 allocate kar dete hain
        run: flutter build apk --release --build-name=1.0.0 --build-number=1 --project-option="android.compileSdkVersion=36"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: rent-manager-apk
          path: build/app/outputs/flutter-apk/app-release.apk

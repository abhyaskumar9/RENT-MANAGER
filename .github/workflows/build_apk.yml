name: Build Android Signed Release APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'

      - name: Create Flutter Android Project
        run: flutter create . --project-name rent_manager --platforms=android --org com.app.rentmanager

      - name: Add WhatsApp Queries to AndroidManifest
        run: |
          python3 -c "
          manifest_path = 'android/app/src/main/AndroidManifest.xml'
          with open(manifest_path, 'r') as f:
              content = f.read()
          queries = '''
              <queries>
                  <package android:name=\"com.whatsapp\" />
                  <package android:name=\"com.whatsapp.w4b\" />
                  <intent>
                      <action android:name=\"android.intent.action.VIEW\" />
                      <data android:scheme=\"https\" />
                  </intent>
                  <intent>
                      <action android:name=\"android.intent.action.VIEW\" />
                      <data android:scheme=\"whatsapp\" />
                  </intent>
              </queries>
          '''
          if '<queries>' not in content:
              content = content.replace('<application', queries + '\n    <application')
              with open(manifest_path, 'w') as f:
                  f.write(content)
          "

      - name: Generate Production Release Keystore & Configure Signing
        run: |
          keytool -genkeypair -v -keystore android/app/release.jks -alias rentmanager -keyalg RSA -keysize 2048 -validity 10000 -storepass rentmanager123 -keypass rentmanager123 -dname "CN=RentManager, OU=App, O=RentManager, L=Delhi, ST=Delhi, C=IN"
          
          python3 -c "
          gradle_path = 'android/app/build.gradle'
          with open(gradle_path, 'r') as f:
              content = f.read()

          signing_config = '''
              signingConfigs {
                  release {
                      storeFile file('release.jks')
                      storePassword 'rentmanager123'
                      keyAlias 'rentmanager'
                      keyPassword 'rentmanager123'
                  }
              }
          '''
          
          # Inject signingConfigs
          if 'signingConfigs {' not in content:
              content = content.replace('buildTypes {', signing_config + '\n    buildTypes {')
          
          # Apply signingConfig to release buildType
          content = content.replace('signingConfig = signingConfigs.debug', 'signingConfig = signingConfigs.release')
          
          with open(gradle_path, 'w') as f:
              f.write(content)
          "

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Signed Universal Release APK
        run: flutter build apk --release

      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: RentManager-Signed-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk

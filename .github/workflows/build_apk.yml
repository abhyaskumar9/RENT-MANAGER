name: Build Direct Installable Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'

      - name: Create Android Platform
        run: flutter create . --project-name rent_manager --platforms=android --org com.app.rentmanager

      - name: Add WhatsApp Queries to AndroidManifest
        run: |
          python3 -c "
          manifest_path = 'android/app/src/main/AndroidManifest.xml'
          with open(manifest_path, 'r') as f:
              content = f.read()
          queries = '''
              <queries>
                  <package android:name=\"com.whatsapp\" />
                  <package android:name=\"com.whatsapp.w4b\" />
                  <intent>
                      <action android:name=\"android.intent.action.VIEW\" />
                      <data android:scheme=\"https\" />
                  </intent>
                  <intent>
                      <action android:name=\"android.intent.action.VIEW\" />
                      <data android:scheme=\"whatsapp\" />
                  </intent>
              </queries>
          '''
          if '<queries>' not in content:
              content = content.replace('<application', queries + '\n    <application')
              with open(manifest_path, 'w') as f:
                  f.write(content)
          "

      - name: Get Flutter Packages
        run: flutter pub get

      - name: Build Direct Signed APK
        run: flutter build apk --debug

      - name: Upload Direct Installable APK
        uses: actions/upload-artifact@v4
        with:
          name: RentManager-Direct-Install
          path: build/app/outputs/flutter-apk/app-debug.apk

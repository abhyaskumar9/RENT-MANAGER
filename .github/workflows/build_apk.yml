name: Build Flutter APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: false

      - name: Bypass Tooling Configuration Bug
        run: |
          # 1. Purani sabhi auto-generated files ko remove karna
          rm -f .flutter-plugins-dependencies .flutter-plugins
          rm -rf android/.gradle android/.flutter-plugins-dependencies
          
          # 2. Local configurations generate karna
          flutter clean
          flutter pub get
          
          # 3. CRITICAL: Android custom native scripts ko dynamic dependency injection ke liye optimize karna
          cd android
          echo "flutter.sdk=$(flutter sdk-path)" > local.properties
          cd ..

      - name: Accept Android Licenses
        run: yes | flutter doctor --android-licenses || true

      - name: Build APK (Bypassing Script Compilation)
        run: flutter build apk --release --no-pub

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: rent-manager-apk
          path: build/app/outputs/flutter-apk/app-release.apk

name: Build Flutter APK

on:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter (Fixed Version)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.5' # Hum ek fixed stable version use kar rahe hain
          channel: 'stable'

      - name: THE NEW TRICK - Delete Lock & Force Fresh Fetch
        run: |
          FLUTTER_DIR=$(find . -name "pubspec.yaml" -exec dirname {} \;)
          cd "$FLUTTER_DIR"
          
          echo "Deleting old pubspec.lock to force fresh, modern plugins..."
          rm -f pubspec.lock
          
          flutter clean
          flutter pub cache clean --force
          flutter pub get

      - name: Build APK
        run: |
          FLUTTER_DIR=$(find . -name "pubspec.yaml" -exec dirname {} \;)
          cd "$FLUTTER_DIR"
          flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Rent Manager APK
          path: '**/outputs/flutter-apk/app-release.apk'

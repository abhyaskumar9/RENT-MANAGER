name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Sync Master Configurations & Build APK
        run: |
          # 1. अगर डबल फोल्डर मौजूद है, तो बाहर के सही एंड्रॉइड सेटअप को अंदर कॉपी करें
          if [ -d "RENT-MANAGER/RENT-MANAGER/android" ] && [ -d "RENT-MANAGER/android" ]; then
            echo "Syncing working android configurations to internal duplicate folder..."
            cp -r RENT-MANAGER/android/* RENT-MANAGER/RENT-MANAGER/android/
          fi

          # 2. सभी जगह की MainActivity को फ्रेश कोटलिन कोड से ओवरराइट करें
          find . -name "MainActivity.kt" -o -name "MainActivity.java" | while read -r file; do
            rm -f "$file"
            dir_path=$(dirname "$file")
            new_file="$dir_path/MainActivity.kt"
            cat << 'EOF' > "$new_file"
          package com.example.management_app_code

          import io.flutter.embedding.android.FlutterActivity

          class MainActivity: FlutterActivity() {
          }
          EOF
          done

          # 3. सही वर्किंग डायरेक्टरी में कदम रखें
          if [ -d "RENT-MANAGER/RENT-MANAGER" ]; then
            cd RENT-MANAGER/RENT-MANAGER
          elif [ -d "RENT-MANAGER" ]; then
            cd RENT-MANAGER
          fi

          echo "Final build path confirmed at: $(pwd)"
          
          # 4. ऐप क्लीन बिल्ड रन करें
          flutter pub get
          flutter build apk --release --android-skip-build-dependency-validation
          
          # 5. बनी हुई APK को बाहर सुरक्षित निकालें
          mkdir -p ../../build_output
          cp build/app/outputs/flutter-apk/app-release.apk ../../build_output/app-release.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Rent-Manager-APK
          path: build_output/app-release.apk

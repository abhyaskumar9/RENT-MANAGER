name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Absolute Nuke All Duplicates & Fresh Rebuild
        run: |
          # 1. पूरे प्रोजेक्ट में जहां भी pubspec.yaml है, वहां खुद ही पहुंचें
          FLUTTER_DIR=$(find . -name "pubspec.yaml" -exec dirname {} \;)
          cd "$FLUTTER_DIR"
          echo "Working in clean directory: $(pwd)"
          
          # 2. पूरे प्रोजेक्ट में जहां भी पुराना या डुप्लीकेट android फोल्डर है, सबको चुन-चुन कर डिलीट करें
          echo "Nuking all old android folders across the project..."
          find . -type d -name "android" -exec rm -rf {} +
          rm -rf .gradle .dart_tool
          
          # 3. फ्लटर को कहें कि वह एकदम नया और फ्रेश एंड्रॉइड प्रोजेक्ट लेआउट बनाए
          echo "Creating brand new fresh android project layout..."
          flutter create . --platforms=android
          
          # 4. लेटेस्ट प्लगइन्स की डिमांड के मुताबिक compileSdk और targetSdk को सीधे 36 पर सेट करें
          find android/app/ -name "build.gradle*" | while read -r gradle_file; do
            echo "Upgrading SDK versions to 36 in: $gradle_file"
            sed -i 's/compileSdk = .*/compileSdk = 36/g' "$gradle_file"
            sed -i 's/targetSdk = .*/targetSdk = 36/g' "$gradle_file"
            sed -i 's/compileSdk(.*/compileSdk(36)/g' "$gradle_file"
            sed -i 's/targetSdk(.*/targetSdk(36)/g' "$gradle_file"
          done
          
          # 5. बिना किसी पुराने वैलिडेशन चेक के सीधे बिल्ड रन करें
          flutter pub get
          flutter build apk --release --android-skip-build-dependency-validation --no-tree-shake-icons
          
          # 6. बनी हुई फ्रेश APK को बाहर डाउनलोड के लिए भेजें
          mkdir -p ../../build_output
          cp build/app/outputs/flutter-apk/app-release.apk ../../build_output/app-release.apk || cp build/app/outputs/apk/release/app-release.apk ../../build_output/app-release.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Rent-Manager-APK
          path: build_output/app-release.apk

name: Build Flutter APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: false # Khas karke purani cache block karne ke liye

      - name: Hard Clean All Folders
        run: |
          # Yeh command pure system me jahan bhi kharab file hai use delete kar degi
          find . -name ".flutter-plugins-dependencies" -exec rm -f {} +
          find . -name ".flutter-plugins" -exec rm -f {} +
          find . -name "pubspec.lock" -exec rm -f {} +
          
          # Ab andar wale project folder me jaakar clean aur fetch karenge
          cd RENT-MANAGER || true
          flutter clean
          flutter pub get

      - name: Accept Android Licenses
        run: yes | flutter doctor --android-licenses || true

      - name: Build APK
        run: |
          cd RENT-MANAGER || true
          flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: rent-manager-apk
          path: "**/build/app/outputs/flutter-apk/app-release.apk"

name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Fix MainActivity & Build APK
        run: |
          # 1. जहां भी MainActivity.kt या MainActivity.java है, उसे बिल्कुल सही कोटलिन कोड से बदलें
          find . -name "MainActivity.kt" -o -name "MainActivity.java" | while read -r file; do
            echo "Fixing MainActivity in: $file"
            rm -f "$file"
            dir_path=$(dirname "$file")
            cat << 'EOF' > "$dir_path/MainActivity.kt"
          package com.example.management_app_code

          import io.flutter.embedding.android.FlutterActivity

          class MainActivity: FlutterActivity() {
          }
          EOF
          done

          # 2. बिना किसी फोल्डर के झंझट के सीधे यहीं रूट पर ऐप बिल्ड करें
          flutter pub get
          flutter build apk --release --android-skip-build-dependency-validation
          
          # 3. बनी हुई APK को सुरक्षित स्थान पर कॉपी करें
          mkdir -p build_output
          cp build/app/outputs/flutter-apk/app-release.apk build_output/app-release.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Rent-Manager-APK
          path: build_output/app-release.apk

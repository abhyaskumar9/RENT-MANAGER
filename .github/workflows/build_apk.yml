name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Nuke Android Folder, Maximize SDK & Rebuild Fresh
        run: |
          # 1. असली फ्लटर प्रोजेक्ट फोल्डर का पता लगाएं
          FLUTTER_DIR=$(find . -name "pubspec.yaml" -exec dirname {} \;)
          cd "$FLUTTER_DIR"
          
          # 2. पुरानी सभी खराबियों को जड़ से मिटाएं (Nuke)
          rm -rf android
          rm -rf .gradle
          rm -rf .dart_tool
          
          # 3. एकदम नया और फ्रेश एंड्रॉइड प्रोजेक्ट लेआउट बनाएं
          flutter create . --platforms=android
          
          # 4. लेटेस्ट प्लगइन्स की डिमांड के मुताबिक compileSdk और targetSdk को सीधे 36 पर सेट करें
          find android/app/ -name "build.gradle*" | while read -r gradle_file; do
            echo "Upgrading SDK versions to 36 in: $gradle_file"
            sed -i 's/compileSdk = .*/compileSdk = 36/g' "$gradle_file"
            sed -i 's/targetSdk = .*/targetSdk = 36/g' "$gradle_file"
            sed -i 's/compileSdk(.*/compileSdk(36)/g' "$gradle_file"
            sed -i 's/targetSdk(.*/targetSdk(36)/g' "$gradle_file"
          done
          
          # 5. बिना किसी पुराने वैलिडेशन चेक के सीधे बिल्ड रन करें
          flutter pub get
          flutter build apk --release --android-skip-build-dependency-validation --no-tree-shake-icons
          
          # 6. बनी हुई फ्रेश APK को बाहर डाउनलोड के लिए भेजें
          mkdir -p ../../build_output
          cp build/app/outputs/flutter-apk/app-release.apk ../../build_output/app-release.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Rent-Manager-APK
          path: build_output/app-release.apk

name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Create Clean Sandbox & Force SDK 36 Build
        run: |
          # 1. असली फ्लटर प्रोजेक्ट फोल्डर का पता लगाएं
          ORIGINAL_DIR=$(find . -name "pubspec.yaml" -exec dirname {} \;)
          echo "Original project found in: $ORIGINAL_DIR"
          
          # 2. सर्वर पर बिल्कुल नया और साफ फोल्डर (Sandbox) तैयार करें
          mkdir -p /home/runner/clean_app
          
          # 3. केवल मुख्य कोड और डिपेंडेंसी फाइल कॉपी करें
          cp -r $ORIGINAL_DIR/lib /home/runner/clean_app/
          cp $ORIGINAL_DIR/pubspec.yaml /home/runner/clean_app/
          if [ -d "$ORIGINAL_DIR/assets" ]; then cp -r $ORIGINAL_DIR/assets /home/runner/clean_app/; fi
          
          cd /home/runner/clean_app
          
          # 4. फ्रेश एंड्रॉइड प्रोजेक्ट लेआउट जनरेट करें
          flutter create . --platforms=android --project-name=rent_manager_app
          
          # 5. [ब्रह्मास्त्र जुगाड़]: पूरे ग्रैडल को हुक्म दें कि वह सभी प्लगइन्स को जबरदस्ती SDK 36 पर बिल्ड करे
          # यह तरीका हर तरह की .gradle और .gradle.kts फाइल पर काम करेगा
          cat << 'EOF' >> android/build.gradle.kts
          subprojects {
              afterEvaluate {
                  if (hasProperty("android")) {
                      extensions.configure<com.android.build.gradle.BaseExtension> {
                          compileSdkVersion(36)
                          targetSdkVersion(36)
                      }
                  }
              }
          }
          EOF

          cat << 'EOF' >> android/build.gradle
          subprojects {
              afterEvaluate { project ->
                  if (project.hasProperty('android')) {
                      project.android {
                          compileSdkVersion 36
                          targetSdkVersion 36
                      }
                  }
              }
          }
          EOF
          
          # 6. डिपेंडेंसी लोड करें और बिना किसी रोक-टोक के ऐप बिल्ड करें
          flutter pub get
          flutter build apk --release --android-skip-build-dependency-validation --no-tree-shake-icons
          
          # 7. बनी हुई बिल्कुल फ्रेश APK को बाहर निकालें
          mkdir -p $GITHUB_WORKSPACE/build_output
          cp build/app/outputs/flutter-apk/app-release.apk $GITHUB_WORKSPACE/build_output/app-release.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Rent-Manager-APK
          path: build_output/app-release.apk

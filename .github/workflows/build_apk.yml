name: Build Android APK

on:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Build Original APK
        run: |
          FLUTTER_DIR=$(find . -name "pubspec.yaml" -exec dirname {} \;)
          cd "$FLUTTER_DIR"
          
          flutter clean
          flutter pub get
          
          # Yeh step pub-cache ke andar chhupe huye ziddi plugins ka Kotlin version forcefully 1.8 kar dega
          echo "Patching pub-cache Kotlin versions..."
          find ~/.pub-cache -name "build.gradle" -exec sed -i 's/1.4/1.8/g' {} + || true
          find ~/.pub-cache -name "*.gradle" -exec sed -i 's/kotlinVersion = "1.4"/kotlinVersion = "1.8"/g' {} + || true
          
          flutter build apk --release --android-skip-build-dependency-validation
          
          mkdir -p ../build_output
          cp build/app/outputs/flutter-apk/app-release.apk ../build_output/app-release.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Rent Manager APK
          path: build_output/app-release.apk
